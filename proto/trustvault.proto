syntax = "proto3";
package trustvault;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

service TrustvaultService {
  rpc CreateCardanoWallet(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc StartUserRegister(google.protobuf.Empty) returns (google.protobuf.Any);
}
